# Bitcoin Prediction Pipeline Taskfile
# ====================================
# Modern task runner using Task (https://taskfile.dev)
# Install: go install github.com/go-task/task/v3/cmd/task@latest

version: '3'

vars:
  PYTHON: python
  SRC_DIR: src
  OUTPUT_DIR: outputs
  VENV_DIR: venv

tasks:
  default:
    desc: "Show help information"
    cmds:
      - task: help

  help:
    desc: "Show available tasks"
    silent: true
    cmds:
      - echo "🚀 Bitcoin Prediction Pipeline Taskfile"
      - echo "========================================"
      - echo ""
      - echo "📊 Training Commands:"
      - echo "  task train              - Run training with default settings"
      - echo "  task train:quick        - Quick test training (10 epochs)"
      - echo "  task train:production   - Full production training (200 epochs)"
      - echo ""
      - echo "🔮 Prediction Commands:"
      - echo "  task predict            - Run prediction validation"
      - echo "  task predict:batch      - Run prediction validation non-interactively"
      - echo ""
      - echo "🛠️  Utility Commands:"
      - echo "  task setup              - Set up Python environment"
      - echo "  task install            - Install dependencies"
      - echo "  task clean              - Clean output files"
      - echo "  task clean:all          - Clean everything including models"
      - echo "  task models:list        - List saved models"
      - echo "  task gpu:check          - Check GPU availability"
      - echo "  task status             - Show current status"
      - echo ""
      - echo "🔧 Development Commands:"
      - echo "  task test:imports       - Test all imports"
      - echo "  task test:quick         - Run quick functionality test"

  # Training tasks
  train:
    desc: "Run training with default settings"
    deps: [ensure-output-dir]
    cmds:
      - echo "🚀 Starting Bitcoin prediction training with default settings..."
      - "{{.PYTHON}} {{.SRC_DIR}}/main.py"

  train:quick:
    desc: "Quick test training (10 epochs)"
    deps: [ensure-output-dir]
    cmds:
      - echo "⚡ Starting quick test training (10 epochs)..."
      - |
        {{.PYTHON}} -c "
        import sys; sys.path.append('{{.SRC_DIR}}')
        from main import example_usage, CONFIGS, OUTPUT_DIR
        OUTPUT_DIR.mkdir(exist_ok=True)
        example_usage(**CONFIGS['quick_test'])
        "

  train:production:
    desc: "Full production training (200 epochs)"
    deps: [ensure-output-dir]
    cmds:
      - echo "🏭 Starting production training (200 epochs)..."
      - echo "⚠️  This will take a long time!"
      - |
        {{.PYTHON}} -c "
        import sys; sys.path.append('{{.SRC_DIR}}')
        from main import example_usage, CONFIGS, OUTPUT_DIR
        OUTPUT_DIR.mkdir(exist_ok=True)
        example_usage(**CONFIGS['production'])
        "

  # Prediction tasks
  predict:
    desc: "Run prediction validation (interactive)"
    cmds:
      - echo "🔮 Starting Bitcoin prediction validation..."
      - "{{.PYTHON}} {{.SRC_DIR}}/predict.py"

  predict:batch:
    desc: "Run prediction validation (non-interactive)"
    cmds:
      - echo "🔮 Running prediction validation in batch mode..."
      - |
        {{.PYTHON}} -c "
        import sys; sys.path.append('{{.SRC_DIR}}')
        from predict import PredictionValidator
        from core import generate_validation_data
        from settings import ValidationConfig, PREDICTION_HORIZONS
        try:
            validator = PredictionValidator(config=ValidationConfig())
            test_data = generate_validation_data()
            results = validator.predict_and_validate(test_data, PREDICTION_HORIZONS[:1])
            validator.export_to_csv(results)
            print('✅ Batch prediction completed successfully!')
        except Exception as e:
            print(f'❌ Error: {e}')
            print('💡 Make sure you have trained models first (run: task train)')
        "

  # Setup and installation tasks
  setup:
    desc: "Set up Python environment"
    cmds:
      - echo "🛠️  Setting up Python environment..."
      - python -m venv {{.VENV_DIR}}
      - echo "✅ Virtual environment created in {{.VENV_DIR}}/"
      - echo "💡 Activate with appropriate command for your OS"

  install:
    desc: "Install dependencies"
    cmds:
      - echo "📦 Installing dependencies..."
      - "{{.PYTHON}} -m pip install --upgrade pip"
      - "{{.PYTHON}} -m pip install torch torchvision torchaudio"
      - "{{.PYTHON}} -m pip install numpy pandas scikit-learn matplotlib tqdm pathlib"
      - echo "✅ Dependencies installed"

  # Utility tasks
  clean:
    desc: "Clean output files (keep models)"
    cmds:
      - echo "🧹 Cleaning output files..."
      - |
        if [ -d "{{.OUTPUT_DIR}}" ]; then
          rm -f {{.OUTPUT_DIR}}/*.csv 2>/dev/null || true
          rm -f {{.OUTPUT_DIR}}/*.log 2>/dev/null || true
          find {{.OUTPUT_DIR}} -name "checkpoint_*.pth" -delete 2>/dev/null || true
        fi
        find . -name "*.pyc" -delete 2>/dev/null || true
        find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
      - echo "✅ Output files cleaned"

  clean:all:
    desc: "Clean everything including models"
    deps: [clean]
    cmds:
      - echo "🧹 Cleaning all files including models..."
      - rm -rf {{.OUTPUT_DIR}}
      - rm -rf {{.VENV_DIR}}
      - echo "✅ All files cleaned"

  # Model management tasks
  models:list:
    desc: "List saved models"
    cmds:
      - echo "📋 Listing saved models..."
      - |
        if [ -d "{{.OUTPUT_DIR}}" ]; then
          echo "📁 Models in {{.OUTPUT_DIR}}:"
          find {{.OUTPUT_DIR}} -name "*.pth" -type f | head -20 | while read file; do
            size=$(du -h "$file" | cut -f1)
            echo "   📄 $file ($size)"
          done
          total=$(find {{.OUTPUT_DIR}} -name "*.pth" -type f | wc -l)
          echo "📊 Total models: $total"
        else
          echo "❌ No output directory found. Run training first."
        fi

  # System info tasks
  gpu:check:
    desc: "Check GPU availability"
    cmds:
      - echo "🔍 Checking GPU availability..."
      - |
        {{.PYTHON}} -c "
        import torch
        print(f'🖥️  CUDA available: {torch.cuda.is_available()}')
        if torch.cuda.is_available():
            print(f'   GPU device: {torch.cuda.get_device_name(0)}')
            print(f'   GPU memory: {torch.cuda.get_device_properties(0).total_memory / 1e9:.1f} GB')
        else:
            print('   Using CPU for training')
        "

  status:
    desc: "Show current status"
    cmds:
      - echo "📊 Bitcoin Prediction Pipeline Status"
      - echo "===================================="
      - echo "🐍 Python version:"
      - "{{.PYTHON}} --version"
      - echo "📁 Working directory:"
      - pwd
      - echo "📂 Source directory: {{.SRC_DIR}}"
      - echo "📂 Output directory: {{.OUTPUT_DIR}}"
      - |
        if [ -d "{{.OUTPUT_DIR}}" ]; then
          models=$(find {{.OUTPUT_DIR}} -name "*.pth" -type f | wc -l)
          echo "🤖 Saved models: $models"
          csvs=$(find {{.OUTPUT_DIR}} -name "*.csv" -type f | wc -l)
          echo "📊 CSV files: $csvs"
        else
          echo "📂 Output directory: Not created yet"
        fi
      - task: gpu:check

  # Development tasks
  test:imports:
    desc: "Test all imports"
    cmds:
      - echo "🧪 Testing imports..."
      - |
        {{.PYTHON}} -c "
        import sys; sys.path.append('{{.SRC_DIR}}')
        try:
            from main import BitcoinPredictionPipeline
            from predict import PredictionValidator
            from models import BitcoinPredictor, BitcoinDataset
            print('✅ All imports successful')
        except ImportError as e:
            print(f'❌ Import error: {e}')
            exit(1)
        "

  test:quick:
    desc: "Run quick functionality test"
    deps: [test:imports]
    cmds:
      - echo "🧪 Running quick functionality test..."
      - |
        {{.PYTHON}} -c "
        import sys; sys.path.append('{{.SRC_DIR}}')
        from main import validate_config
        if validate_config(10, 32, 30, 64, 0.01, 1):
            print('✅ Configuration validation passed')
        else:
            print('❌ Configuration validation failed')
            exit(1)
        "

  # Internal utility tasks
  ensure-output-dir:
    desc: "Ensure output directory exists"
    internal: true
    cmds:
      - mkdir -p {{.OUTPUT_DIR}}
    silent: true 